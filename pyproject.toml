[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dokulanc"
version = "0.1.0"
description = "Többmodelles dokumentumfeldolgozó lánc: típusfelismerés, OCR, LLM-alapú adatkinyerés és ellenőrzés"
requires-python = ">=3.11"

[project.scripts]
dokulanc = "dokulanc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["llm: Ollama szervert igénylő teszt", "gpu: GPU-t vagy letöltött modellt igénylő teszt"]
